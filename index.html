---
layout: default
title: Home
---
<div>
  <h1>Alchimestre</h1>
  <p><a href="{{ '/resume.pdf' | relative_url }}">Resume</a></p>
  <h2>Posts</h2>
  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <a href="{{ post.url | relative_url }}">{{ post.date | date: "%Y-%m-%d" }} &mdash; {{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
</div>
