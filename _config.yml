title: Alchimestre
description: >-
 SRE & Artist

permalink: /:slug.html

paginate: 5
paginate_path: "/page:num/"

remote_theme: riggraz/no-style-please

# The theme's _config.yml lists the jektex plugin (not on GitHub Pages);
# we replicate its settings here instead.
ignore_theme_config: true

theme_config:
  appearance: "dark"
  show_description: true
  date_format: "%Y-%m-%d"
  back_home_text: "← index"

sass:
  style: compressed

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
